[project]
name = "game-utils-audio"
version = "0.1.0"
description = "Shell to drive game SFX and BGM backends (jsfxr / rFXGen / ACE-Step)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gu-audio = "game_utils_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_utils_audio"]
